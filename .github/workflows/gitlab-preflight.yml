name: GitLab preflight

# The buildbot's jobs (.gitlab-ci.yml) replayed in the same images, as the
# buildbot cannot be run from here
on:
  workflow_dispatch:

jobs:
  loader-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD":/src -w /src ubuntu:22.04 bash -c 'git config --global --add safe.directory /src; bash .ci/libretro-loader.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: loader-x86
          path: loader-x86.tar.gz

  linux-x64:
    needs: loader-x86
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: loader-x86
      - run: docker run --rm -e NUMPROC=1 -v "$PWD":/src -w /src ubuntu:22.04 bash -c 'git config --global --add safe.directory /src; bash .ci/libretro-linux.sh && ls -la lindbergh_libretro.so'

  linux-aarch64:
    needs: loader-x86
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: loader-x86
      - run: docker run --rm -e NUMPROC=1 -v "$PWD":/src -w /src ubuntu:24.04 bash -c 'git config --global --add safe.directory /src; bash .ci/libretro-linux.sh && ls -la lindbergh_libretro.so'

  windows-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -e NUMPROC=1 -v "$PWD":/src -w /src ubuntu:24.04 bash -c 'git config --global --add safe.directory /src; bash .ci/libretro-windows.sh && ls -la lindbergh_libretro.dll'
